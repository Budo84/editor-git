<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proflama Editor Stable</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });
        window.mermaid = mermaid;
    </script>

    <style>
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #editor-area { flex: 1; display: flex; overflow: hidden; position: relative; }
        textarea { resize: none; outline: none; transition: all 0.2s; }
        .modal { transition: opacity 0.2s ease-in-out; }
        .modal.hidden { opacity: 0; pointer-events: none; }
        .modal:not(.hidden) { opacity: 1; pointer-events: auto; }

        /* Typography & Preview */
        .prose { padding-bottom: 5rem; }
        .prose h1 { font-size: 2em; font-weight: bold; margin: 1em 0 0.5em; border-bottom: 1px solid #eee; color: #1e3a8a; }
        .prose h2 { font-size: 1.5em; font-weight: bold; margin: 1em 0 0.5em; color: #1e40af; }
        .prose h3 { font-size: 1.25em; font-weight: bold; margin: 1em 0 0.5em; color: #2563eb; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose p { margin-bottom: 1em; line-height: 1.6; }
        .prose blockquote { border-left: 4px solid #e5e7eb; padding-left: 1em; color: #4b5563; font-style: italic; }
        .prose code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; color: #e11d48; font-size: 0.9em; }
        .prose pre { background-color: #1f2937; color: white; padding: 1em; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }
        .prose pre code { background-color: transparent; color: inherit; padding: 0; }
        .prose img, .prose video { max-width: 100%; border-radius: 8px; margin: 1em 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .prose a { color: #2563eb; text-decoration: underline; }

        /* Custom Box */
        .custom-block { padding: 1rem; border-radius: 8px; margin: 1rem 0; border-left: 4px solid; background-color: #f9fafb; }
        .custom-block-title { font-weight: bold; margin-bottom: 0.5rem; display: block; }
        .tip { border-color: #10b981; background-color: #ecfdf5; }
        .warning { border-color: #f59e0b; background-color: #fffbeb; }
        .danger { border-color: #ef4444; background-color: #fef2f2; }
        .info { border-color: #3b82f6; background-color: #eff6ff; }
        
        .fmt-btn { @apply p-1.5 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded text-sm font-semibold border border-transparent hover:border-blue-100 transition min-w-[30px] flex justify-center items-center; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white border-b p-3 shadow-sm flex flex-col gap-3 z-10 shrink-0">
        <div class="flex flex-wrap gap-2 items-center justify-between sm:justify-start">

                <button onclick="openModal('meta-modal')" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-blue-200 hover:bg-blue-200">📝 Dati</button>

    <script>
        const input = document.getElementById('markdown-input');
        const preview = document.getElementById('preview-output');
        const editorCol = document.getElementById('editor-col');
        
        // --- 1. INIT & EVENTS ---
        window.addEventListener('load', () => {
            ['gh-token', 'gh-owner', 'gh-repo', 'gh-path', 'gh-img-base'].forEach(id => {
                const saved = localStorage.getItem('my_' + id);
                if (saved) document.getElementById(id).value = saved;
                document.getElementById(id).addEventListener('input', (e) => localStorage.setItem('my_' + id, e.target.value));
            });
            document.getElementById('meta-date').valueAsDate = new Date();
            
            const curPath = document.getElementById('gh-path').value.trim() || '_untitled';
            const savedDraft = localStorage.getItem('autosave_draft_' + curPath) || localStorage.getItem('autosave_draft');
            if (savedDraft && savedDraft.length > 10) {
                if(confirm(`Bozza non salvata trovata per "${curPath}". Recuperare?`)) {
                    input.value = savedDraft;
                    renderPreview();
                }
            } else {
                renderPreview();
            }
            localStorage.removeItem('autosave_draft'); // migrazione dalla vecchia chiave unica
        });

        input.addEventListener('input', () => {
            const curPath = document.getElementById('gh-path').value.trim() || '_untitled';
            localStorage.setItem('autosave_draft_' + curPath, input.value);
            // Word Count
            const text = input.value;
            const words = text.trim().split(/\s+/).length;
            const time = Math.ceil(words / 200);
            document.getElementById('word-count').innerText = `${words} parole (~${time} min)`;
            renderPreview();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); syncTextToGitHub(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); fmt('**', '**'); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); fmt('*', '*'); }
        });

        input.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = [];
            for (const item of items) if (item.kind === 'file' && item.type.startsWith('image/')) files.push(item.getAsFile());
            if (files.length > 0) {
                e.preventDefault();
                if(confirm(`Caricare ${files.length} immagini?`)) for (const f of files) await handleFileUploadLogic(f, true);
            }
        });

        // --- 2. LOGICA ANTEPRIMA (RIPARATA) ---
        // Funzione per preprocessare i box colorati (::: tip) PRIMA di Marked
        // Questo risolve i crash delle nuove versioni di marked.js
        function preProcessMarkdown(text) {
            // Regex per trovare blocchi ::: tipo ... :::
            // Sostituisce con <div class="custom-block type"><span...>TITLE</span>content</div>
            return text.replace(/^::: (\w+) (.*)\n([\s\S]*?)\n:::$/gm, (match, type, title, content) => {
                return `<div class="custom-block ${type}"><span class="custom-block-title">${title || type.toUpperCase()}</span>\n${content}\n</div>`;
            });
        }

        async function renderPreview() {
            if (typeof marked === 'undefined') {
                preview.innerHTML = `<div class="p-4 text-red-600 font-bold bg-red-50 border border-red-200 rounded">⚠️ Attendere caricamento librerie...</div>`;
                return;
            }

            // 1. Rimuovi Frontmatter (YAML)
            let content = input.value.replace(/^\s*---[\s\S]*?---\s*/, '');
            
            // 2. Pre-processa i box colorati
            content = preProcessMarkdown(content);

            try {
                // 3. Converti Markdown -> HTML
                preview.innerHTML = marked.parse(content);
                
                // 4. Formule (MathJax)
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([preview]).catch(() => {});
                }

                // 5. Diagrammi (Mermaid)
                if (window.mermaid) {
                    const graphs = document.querySelectorAll('.language-mermaid');
                    graphs.forEach(async (graph, index) => {
                        try {
                            const { svg } = await window.mermaid.render('mermaid-' + index, graph.innerText);
                            graph.parentElement.innerHTML = svg;
                        } catch (e) { console.log("Mermaid:", e); }
                    });
                }
            } catch (e) {
                console.error(e);
                preview.innerHTML += `<div class="text-red-500 text-xs mt-2">Errore Render: ${e.message}</div>`;
            }
        }

        // --- TOOLBAR ---
        function fmt(s, e) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const val = input.value;
            const r = s + val.substring(start, end) + e;
            input.value = val.substring(0, start) + r + val.substring(end);
            input.selectionStart = input.selectionEnd = start + r.length;
            input.focus();
            renderPreview();
        }
        function insertTemplate(type) {
            const templates = {

        // --- UTILS ---
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function b64EncodeUnicode(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))); }
        function b64DecodeUnicode(str) { return decodeURIComponent(Array.prototype.map.call(atob(str), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); }
        function getCreds() { return { token: document.getElementById('gh-token').value.trim(), owner: document.getElementById('gh-owner').value.trim(), repo: document.getElementById('gh-repo').value.trim() }; }

        function loading(s, m="") { const el=document.getElementById('loading-overlay'); if(s){document.getElementById('loading-msg').innerText=m; el.classList.remove('hidden');}else{el.classList.add('hidden');} }

        // --- NUMERAZIONE AUTOMATICA LEZIONI ---
        // Esegue max `limit` richieste in parallelo alla volta, per non sovraccaricare l'API GitHub
        async function mapLimit(items, limit, fn) {
            const results = new Array(items.length);
            let i = 0;
            async function worker() {
                while (i < items.length) {
                    const idx = i++;
                    results[idx] = await fn(items[idx]);
                }
            }
            await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
            return results;
        }

        async function suggestNextNumber() {
            const creds = getCreds();
            if (!creds.token) return showStatus("Manca il Token (Configurazione, in 📷 Media)", 'error');
            const cat = document.getElementById('meta-cat').value;
            loading(true, "Scansiono le lezioni esistenti...");
            try {
                const dirRes = await fetch(`https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/docs/blog?t=${Date.now()}`, { headers: { 'Authorization': `token ${creds.token}` } });
                if (!dirRes.ok) throw new Error("Impossibile leggere docs/blog");
                const dirList = await dirRes.json();
                const mdFiles = Array.isArray(dirList) ? dirList.filter(f => f.type === 'file' && f.name.endsWith('.md')) : [];

                let maxNum = 0, found = 0;
                await mapLimit(mdFiles, 6, async (f) => {
                    try {
                        const r = await fetch(`https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${f.path}`, { headers: { 'Authorization': `token ${creds.token}` } });
                        if (!r.ok) return;
                        const content = b64DecodeUnicode((await r.json()).content);
                        const fmMatch = content.match(/^---([\s\S]*?)---/);
                        if (!fmMatch) return;
                        const catMatch = fmMatch[1].match(/category:\s*(.+)/i);
                        if (!catMatch || catMatch[1].trim().toLowerCase() !== cat.toLowerCase()) return;
                        const numMatch = f.name.match(/^(\d+)/);
                        if (numMatch) { found++; maxNum = Math.max(maxNum, parseInt(numMatch[1], 10)); }
                    } catch (e) { /* file singolo non leggibile: lo saltiamo */ }
                });

                const nextNum = maxNum + 1;
                const title = document.getElementById('meta-title').value.trim();
                const slug = title ? title.toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-') : 'nuova-lezione';
                document.getElementById('gh-path').value = `docs/blog/${nextNum}-${slug}.md`;
                showStatus(`Categoria "${cat}": trovate ${found} lezioni, prossimo numero = ${nextNum}`);
            } catch (e) {
                showStatus(e.message, 'error');
            } finally {
                loading(false);
            }
        }

        // --- COMPRESSIONE WEBP (client-side, prima dell'upload) ---
        function compressToWebP(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error("Compressione WebP non riuscita (browser non supportato?)"));
                            resolve(blob);
                        }, 'image/webp', quality);
                    };
                    img.onerror = () => reject(new Error("Immagine non leggibile"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Lettura file fallita"));
                reader.readAsDataURL(file);
            });
        }

        // --- UPLOAD ---
        document.getElementById('modal-file-input').addEventListener('change', async (e) => { if(e.target.files.length) { for(const f of e.target.files) await handleFileUploadLogic(f, false); e.target.value=''; closeModal('media-modal'); } });
        async function handleFileUploadLogic(file, isPaste) {
            const creds = getCreds(); if (!creds.token) return showStatus("Manca Token", 'error');
            const base = document.getElementById('gh-img-base').value.trim().replace(/\/$/, '') + '/';
            let name = file.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9._-]/g, '');
            if (isPaste && (name==='image.png'||name==='Unknown.png')) name = "screenshot_" + Date.now() + ".png";

            const doCompress = document.getElementById('opt-webp').checked && file.type.startsWith('image/') && file.type !== 'image/svg+xml' && file.type !== 'image/webp';
            let uploadFile = file;
            if (doCompress) {
                try {
                    loading(true, "Compressione WebP...");
                    const blob = await compressToWebP(file, 1200, 0.8);
                    name = name.replace(/\.[^.]+$/, '') + '.webp';
                    uploadFile = new File([blob], name, { type: 'image/webp' });
                } catch (e) {
                    console.warn("Compressione WebP fallita, carico il file originale:", e.message);
                    uploadFile = file; // fallback: carica l'originale se il browser non sa comprimere in WebP
                }
            }

            loading(true, "Upload " + name);
            try {
                const buf = await uploadFile.arrayBuffer(); let bin = ''; new Uint8Array(buf).forEach((b) => bin += String.fromCharCode(b));
                const url = `https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${base + name}`;
                const res = await fetch(url, { method: 'PUT', headers: {'Authorization': `token ${creds.token}`, 'Content-Type': 'application/json'}, body: JSON.stringify({message: "Upload media", content: btoa(bin)}) });
                if(!res.ok) throw new Error("Err Upload");
                const relPath = '/' + (base + name).replace('docs/public/', '');
                document.getElementById('meta-image').value = relPath; // AUTO COVER
                let tag = uploadFile.type.startsWith('video/') ? `\n<video src="${relPath}" autoplay loop muted playsinline width="100%"></video>\n` : `\n<center>\n\t<img src="${relPath}" alt="${name}" width="300"/>\n</center>\n`;
                const s = input.selectionStart; input.value = input.value.substring(0, s) + tag + input.value.substring(input.selectionEnd);
                renderPreview(); showStatus("Fatto!" + (doCompress ? " (compresso in WebP)" : ""));
            } catch(e) { showStatus(e.message, 'error'); } finally { loading(false); }
        }

        // --- ESPORTAZIONE PDF (senza troncamenti strani) ---
        async function exportPDF() {
            if (typeof html2pdf === 'undefined') return showStatus("Libreria PDF non ancora caricata, riprova tra un istante", 'error');

            // 1. Assicura che l'anteprima sia aggiornata (marked + MathJax + Mermaid)
            await renderPreview();
            // Piccola attesa per dare tempo a MathJax/Mermaid (asincroni) di completare il rendering
            await new Promise(r => setTimeout(r, 500));

            // 2. Estrae titolo/metadati dal front matter per intestazione e nome file
            const fmMatch = input.value.match(/^---([\s\S]*?)---/);
            let title = 'Lezione', category = '', target = '', duration = '';
            if (fmMatch) {
                const get = (key) => { const m = fmMatch[1].match(new RegExp(key + ':\\s*(.+)')); return m ? m[1].replace(/['"]/g, '').trim() : ''; };
                title = get('title') || title;
                category = get('category');
                target = get('class_target');
                duration = get('duration');
            }
            const subtitleParts = [category, target ? `Classe: ${target}` : '', duration ? `${duration} min` : ''].filter(Boolean);

            // 3. Costruisce un contenitore "pulito" fuori schermo, con CSS dedicato alla stampa
            //    (foglio A4, niente sfondo grigio dell'editor, e soprattutto le regole anti-troncamento)
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:fixed; left:-9999px; top:0; width:190mm; background:#fff; color:#1e293b; font-family:sans-serif;';
            wrapper.innerHTML = `
                <style>
                    .pdf-root { padding: 4mm; }
                    .pdf-root h1 { font-size: 22px; color: #1e3a8a; margin: 0 0 2px; }
                    .pdf-root .pdf-subtitle { font-size: 12px; color: #64748b; margin-bottom: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
                    .pdf-root h1, .pdf-root h2, .pdf-root h3 {
                        break-after: avoid; page-break-after: avoid; /* niente titoli isolati a fine pagina */
                        break-inside: avoid; page-break-inside: avoid;
                    }
                    .pdf-root p, .pdf-root li { orphans: 3; widows: 3; }
                    .pdf-root img {
                        max-width: 100%;
                        max-height: 230mm; /* un'immagine non supera mai un'intera pagina: non verrà mai tagliata a metà */
                        break-inside: avoid; page-break-inside: avoid;
                        display: block; margin: 10px auto;
                    }
                    .pdf-root table, .pdf-root tr, .pdf-root pre, .pdf-root blockquote, .pdf-root .custom-block {
                        break-inside: avoid; page-break-inside: avoid;
                    }
                    .pdf-root table { border-collapse: collapse; width: 100%; font-size: 12px; }
                    .pdf-root th, .pdf-root td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
                    .pdf-root pre { background:#1f2937; color:#fff; padding:10px; border-radius:6px; font-size:11px; overflow-wrap: break-word; white-space: pre-wrap; }
                    .pdf-root code { font-family: monospace; }
                    .pdf-root .custom-block { border-left: 4px solid #3b82f6; background:#eff6ff; padding:10px; border-radius:6px; margin:10px 0; }
                </style>
                <div class="pdf-root">
                    <h1>${title}</h1>
                    ${subtitleParts.length ? `<div class="pdf-subtitle">${subtitleParts.join(' · ')}</div>` : ''}
                    ${preview.innerHTML}
                </div>`;
            document.body.appendChild(wrapper);

            const fileSlug = (title || 'lezione').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

            const opt = {
                margin: [12, 10, 14, 10], // top, left, bottom, right (mm) - margine extra in basso per non "schiacciare" l'ultima riga
                filename: `${fileSlug}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: {
                    mode: ['css', 'legacy'],
                    avoid: ['img', 'table', 'tr', 'pre', 'blockquote', '.custom-block', 'h1', 'h2', 'h3', 'li']
                }
            };

            loading(true, "Generazione PDF...");
            try {
                await html2pdf().set(opt).from(wrapper.querySelector('.pdf-root')).save();
                showStatus("PDF generato!");
            } catch (e) {
                showStatus("Errore PDF: " + e.message, 'error');
            } finally {
                document.body.removeChild(wrapper);
                loading(false);
            }
        }

        // --- CONTROLLO IMMAGINI/LINK PRIMA DI PUBBLICARE ---
        async function checkImages() {
            const creds = getCreds();
            if (!creds.token) return showStatus("Manca il Token (Configurazione, in 📷 Media)", 'error');

            // Trova sia ![alt](percorso) markdown sia <img src="percorso">, ignorando URL esterni (http/https)
            const mdImgs = [...input.value.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)].map(m => m[1]);
            const htmlImgs = [...input.value.matchAll(/<img[^>]+src=["']([^"']+)["']/g)].map(m => m[1]);
            const allPaths = [...new Set([...mdImgs, ...htmlImgs])].filter(p => !/^https?:\/\//i.test(p) && !p.startsWith('data:'));

            if (allPaths.length === 0) return showStatus("Nessuna immagine locale da controllare");

            loading(true, `Controllo ${allPaths.length} immagini...`);
            const missing = [];
            try {
                await mapLimit(allPaths, 6, async (p) => {
                    // Converte il percorso pubblico nel percorso reale nel repo (docs/public/...), gestendo sia /img/x.png sia img/x.png
                    const repoPath = 'docs/public/' + p.replace(/^\//, '');
                    try {
                        const r = await fetch(`https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${repoPath}`, { headers: { 'Authorization': `token ${creds.token}` } });
                        if (!r.ok) missing.push(p);
                    } catch (e) { missing.push(p); }
                });
                if (missing.length === 0) {
                    showStatus(`✅ Tutte le ${allPaths.length} immagini esistono nel repo`);
                } else {
                    showStatus(`⚠️ ${missing.length} immagine/i mancante/i su GitHub`, 'error');
                    alert("Immagini NON trovate nel repository:\n\n" + missing.join("\n"));
                }
            } finally {
                loading(false);
            }
        }

        // --- ELIMINA FILE CORRENTE (bottone header) ---
        async function deleteFile() {
            const c = getCreds();
            const p = document.getElementById('gh-path').value.trim();
            if (!c.token) return showStatus("Manca Token", 'error');
            if (!p) return showStatus("Nessun percorso file impostato", 'error');
            if (!confirm(`Eliminare definitivamente "${p}" dal repository?`)) return;
            loading(true, "Eliminazione...");
            try {
                const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`, { headers: { 'Authorization': `token ${c.token}` } });
                if (!r.ok) throw new Error("File non trovato su GitHub");
                const sha = (await r.json()).sha;
                const del = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${c.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${p}`, sha })
                });
                if (!del.ok) throw new Error("Errore durante l'eliminazione");
                input.value = '';
                localStorage.removeItem('autosave_draft_' + p);
                renderPreview();
                showStatus("File eliminato!");
            } catch (e) {
                showStatus(e.message, 'error');
            } finally {
                loading(false);
            }
        }

        // --- FILE MANAGER & LOAD/SAVE ---
        let fmPathCur = '';
        function openFileManager() { fmNavigate(document.getElementById('gh-img-base').value || ''); openModal('file-modal'); }
        function fmFilter() { const q = document.getElementById('fm-search').value.toLowerCase(); document.querySelectorAll('#fm-list > div').forEach(i => i.style.display = i.innerText.toLowerCase().includes(q) ? 'flex' : 'none'); }
        async function fmNavigate(p) {
            p = p.replace(/^\/|\/$/g, ''); fmPathCur = p; document.getElementById('fm-path').value = p;
            const creds = getCreds(); const list = document.getElementById('fm-list');
            list.innerHTML = '<p class="col-span-full text-center text-gray-400">Loading...</p>';
            try {
                const res = await fetch(`https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${p}?t=${Date.now()}`, { headers: {'Authorization': `token ${creds.token}`} });
                if(!res.ok) throw new Error("Dir not found");
                const data = await res.json(); if(!Array.isArray(data)) throw new Error("Err Data");
                list.innerHTML = '';
                data.sort((a,b)=>(a.type===b.type)?0:(a.type==='dir'?-1:1)).forEach(i => {
                    const isD = i.type === 'dir'; const div = document.createElement('div');
                    div.className = `border rounded p-2 flex items-center justify-between hover:bg-slate-50 ${isD ? 'bg-indigo-50' : 'bg-white'}`;
                    div.innerHTML = `<div class="flex items-center gap-2 overflow-hidden cursor-pointer flex-1" onclick="${isD?`fmNavigate('${i.path}')`:`fmSelectFile('${i.path}')`}"><span class="text-xl">${isD?'📁':(i.name.match(/\.(png|jpg|gif)$/)?'🖼️':'📄')}</span><span class="text-sm truncate">${i.name}</span></div><div class="flex gap-1"><button onclick="fmRename('${i.path}','${i.sha}','${i.type}')" class="p-1 hover:bg-gray-200 rounded">✏️</button><button onclick="fmDelete('${i.path}','${i.sha}')" class="p-1 hover:bg-red-100 text-red-500 rounded">🗑️</button></div>`;
                    list.appendChild(div);
                });
            } catch(e) { list.innerHTML = `<p class="text-red-500 col-span-full">${e.message}</p>`; }
        }
        function fmUp() { if(fmPathCur) fmNavigate(fmPathCur.split('/').slice(0,-1).join('/')); }
        function fmRefresh() { fmNavigate(fmPathCur); }
        function fmSelectFile(p) { if(p.endsWith('.md') && confirm("Aprire?")) { document.getElementById('gh-path').value = p; closeModal('file-modal'); loadFromGitHub(); } }
        async function fmCreateFolder() { const n = prompt("Nome:"); if(!n) return; apiCall('PUT', (fmPathCur?fmPathCur+'/':'')+n+'/.keep', {message:"New Folder", content:""}, ()=>fmRefresh()); }
        async function fmDelete(p,s) { if(confirm("Del?")) apiCall('DELETE', p, {message:"Del", sha:s}, ()=>fmRefresh()); }
        async function fmRename(p,s,t) { if(t==='dir') return alert("No dir rename"); const n = prompt("New Name:", p.split('/').pop()); if(!n) return; const creds = getCreds(); loading(true); try { const g = await fetch(`https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${p}`,{headers:{'Authorization':`token ${creds.token}`}}); const d = await g.json(); await apiCall('PUT', p.substring(0,p.lastIndexOf('/'))+'/'+n, {message:"Ren", content:d.content}); await apiCall('DELETE', p, {message:"Del Old", sha:s}); fmRefresh(); } catch(e){alert(e);} finally{loading(false);} }
        async function apiCall(m, p, b, cb) { const c = getCreds(); loading(true); try { await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`, {method:m, headers:{'Authorization':`token ${c.token}`, 'Content-Type':'application/json'}, body:JSON.stringify(b)}); if(cb) cb(); } catch(e){alert(e);} finally{loading(false);} }
        async function loadFromGitHub() { const c = getCreds(); const p = document.getElementById('gh-path').value.trim(); if(!c.token) return showStatus("No Token", 'error'); loading(true, "Download..."); try { const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}?t=${Date.now()}`, {headers:{'Authorization':`token ${c.token}`}}); if(!res.ok) throw new Error("404"); input.value = b64DecodeUnicode((await res.json()).content); renderPreview(); showStatus("Caricato!"); } catch(e){ showStatus(e.message, 'error'); } finally{loading(false);} }
        async function syncTextToGitHub() { const c = getCreds(); const p = document.getElementById('gh-path').value.trim(); if(!c.token) return showStatus("No Token", 'error'); const btn = document.getElementById('save-btn'); btn.innerText="⏳"; btn.disabled=true; try { let sha = null; try { const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`, {headers:{'Authorization':`token ${c.token}`}}); if(r.ok) sha=(await r.json()).sha; } catch(e){} const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`, { method: 'PUT', headers: {'Authorization': `token ${c.token}`, 'Content-Type': 'application/json'}, body: JSON.stringify({ message: sha ? `Update ${p}` : `Create ${p}`, content: b64EncodeUnicode(input.value), sha: sha || undefined }) }); if(!res.ok) throw new Error("Err Save"); localStorage.removeItem('autosave_draft_' + p); showStatus("Salvato!"); } catch(e){ showStatus(e.message, 'error'); } finally{ btn.innerText="Salva"; btn.disabled=false; } }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrato: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('Errore ServiceWorker: ', error);
                    });
            });
        }
    </script>
